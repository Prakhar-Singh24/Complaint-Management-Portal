<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Complaint Management System</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">
            <div class="logo">
                <img src="./images/logo.png" alt="Logo">
                <div class="portal-name">
                    <h2>Complaint</h2>
                    <p>Management Portal</p>
                </div>
            </div>

            <div class="navigator">
                <ul>
                    <li><a href="./index.html">Home</a> </li>
                    <li><a href="./complaint.html">Submit Complaint</a> </li>
                    <li><a href="./track.html">Track</a> </li>
                    <li><a href="./about.html">About</a> </li>
                    <li><a href="./contact.html">Contact Us</a> </li>
                </ul>
            </div>

            <div class="buttons">
                <button class="login" id="loginUserBtn">Login</button>
                <button class="register" id="registerUserBtn">Register</button>
            </div>
        </nav>
    </header>

    <!-- Login Body -->
    <section class="login-page">
        <div class="login-container">
            <div class="lock">
                <img src="./images/login-logo.svg">
            </div>

            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login to access your complaints and track their status.</p>
            </div>

            <form>
                <div class="input-details">
                    <label>Email or Mobile Number</label>
                    <input id="loginEmail" type="text" placeholder="Enter your email or mobile number"
                        autocomplete="username">
                    <small id="loginPageEmail"></small>
                </div>


                <div class="input-details">
                    <label>Password</label>

                    <div class="password-field">
                        <input id="loginPassword" type="password" placeholder="Enter your password">

                        <button type="button" class="toggle-password" data-target="loginPassword">
                            <img src="./images/eye-open.svg" class="eye-icon">
                        </button>
                    </div>

                    <small id="loginPagePassword"></small>

                </div>

                <a href="forgotpassword.html" class="forgot-password">
                    Forgot Password?
                </a>

                <button id="loginBtn" type="submit" class="account-btn">
                    Login
                </button>
            </form>

            <p class="account-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer-login">
        <p>
            © 2026 Complaint Management Portal.
            All Rights Reserved.
        </p>
    </footer>

    <script src="./script/script.js"></script>
</body>

</html>
