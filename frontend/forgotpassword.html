<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="./images/logo.png" alt="Logo">

                <div class="portal-name">
                    <h2>Complaint</h2>
                    <p>Management Portal</p>
                </div>

            </div>
        </nav>
    </header>

    <section class="login-page">
        <div class="login-container">

            <div class="lock">
                <img src="./images/login-logo.svg">
            </div>

            <div class="login-header">
                <h1>Forgot Password</h1>
                <p>
                    Enter your registered email address.
                </p>
            </div>

            <form>

                <div class="input-details">
                    <label>Email Address</label>
                    <input id="forgotEmail" type="email" placeholder="Enter your registered email">
                    <small id="emailForgot"></small>
                </div>

                <div class="input-details">
                    <label>New Password</label>

                    <div class="password-field">
                        <input id="newPassword" type="password" placeholder="Enter new password">

                        <button type="button" class="toggle-password" data-target="newPassword">
                            <img src="./images/eye-open.svg" class="eye-icon">
                        </button>
                    </div>

                    <small id="newPasswordForgot"></small>

                </div>

                <div class="input-details">
                    <label>Confirm Password</label>

                    <div class="password-field">
                        <input id="confirmNewPassword" type="password" placeholder="Confirm new password">

                        <button type="button" class="toggle-password" data-target="confirmNewPassword">
                            <img src="./images/eye-open.svg" class="eye-icon">
                        </button>
                    </div>

                    <small id="confirmNewPasswordForgot"></small>
                </div>

                <button id="resetPasswordBtn" type="submit" class="account-btn">
                    Reset Password
                </button>

            </form>

            <p class="account-link">
                <a href="login.html">
                    Back to Login
                </a>
            </p>

        </div>
    </section>

    <footer class="footer-login">
        <p>
            © 2026 Complaint Management Portal.
            All Rights Reserved.
        </p>
    </footer>

    <script src="./script/script.js"></script>

</body>

</html>
